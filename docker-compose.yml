# Internal server: PostgreSQL 16 + the WMS image, with persistent volumes. Works on Linux, or Windows with Docker.
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d --build
# Put the app behind the authority's reverse proxy / load balancer with TLS (see docs/wms/06-installation.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: iarda_wms
      POSTGRES_USER: wms_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      TZ: Asia/Riyadh
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_owner -d iarda_wms"]
      interval: 10s
      retries: 10

  app:
    build: .
    image: iarda-wms:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_OWNER_URL: postgres://wms_owner:${DB_OWNER_PASSWORD}@db:5432/iarda_wms
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-storage:/data

volumes:
  db-data:
  app-storage:
